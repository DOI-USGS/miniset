version: 2

# Automated dependency updates. Keeps the docs toolchain, the WASM test/package
# manifests, and the CI actions current. Note that third-party GitHub Actions are
# pinned to full commit SHAs (DGEC requirement); Dependabot understands SHA pins
# and will bump the SHA and the trailing version comment together.
updates:
  # Docs build toolchain (mkdocs + Material theme).
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - documentation
    commit-message:
      prefix: "deps(docs):"

  # WASM npm package manifest.
  - package-ecosystem: npm
    directory: /wasm
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps(wasm):"

  # WASM test harness npm manifest.
  - package-ecosystem: npm
    directory: /tests/wasm
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - tests
    commit-message:
      prefix: "deps(tests):"

  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "deps(ci):"
